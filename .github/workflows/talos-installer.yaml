# Builds a Talos installer image for node proxmox-sg-amd-0 (VM 100 talos-01) that mirrors its
# Image Factory schematic f4ce4d92494bba971a3dfe1144f06ea9107dd57142dd875d076931bd7aab6480
# (same extensions and kernel args; no amdgpu.cwsr_enable workaround — firmware fix only), but with the custom amdgpu extension (linux-firmware 20261019 GC 11.0.1 firmware) instead of
# the stock siderolabs/amdgpu. Publishes to ghcr.io/<owner>/talos-installer.
name: talos-installer
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: talos-installer
  cancel-in-progress: true
env:
  TALOS_VERSION: v1.13.5
  AMDGPU_EXT: ghcr.io/kelvl/amdgpu:20261019-v1.13.5-fw20261019@sha256:ff3787c7cf2dc59a663b5b7c08d8496960e519dd0f111a9ae2d7020be995c514
  AMD_UCODE_EXT: ghcr.io/siderolabs/amd-ucode:20260519@sha256:4727bcdcd647ec48f4c3870559c2321a437e657ce993342ddb1ce3da6d91e827
  QEMU_GA_EXT: ghcr.io/siderolabs/qemu-guest-agent:11.0.1@sha256:9e65a322c431348daa162758cd682d989117239b8dcf1bcfdcd539b3e039eb91
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: imjasonh/setup-crane@v0.4
      - name: Build installer with imager
        run: |
          mkdir -p _out
          args=(
            --extra-kernel-arg earlyprintk=ttyS0
            --extra-kernel-arg console=ttyS0
            --extra-kernel-arg amd.gttsize=32768
            --extra-kernel-arg -selinux
            --extra-kernel-arg selinux=0
          )
          docker run --rm -t -v "$PWD/_out:/out" -v /dev:/dev --privileged \
            ghcr.io/siderolabs/imager:${TALOS_VERSION} installer --arch amd64 \
            --system-extension-image "${AMD_UCODE_EXT}" \
            --system-extension-image "${AMDGPU_EXT}" \
            --system-extension-image "${QEMU_GA_EXT}" \
            "${args[@]}" 2>&1 | tee _out/imager.log
          ls -la _out
      - name: Push installer
        id: push
        run: |
          ref="ghcr.io/${{ github.repository_owner }}/talos-installer:${TALOS_VERSION}-amdgpu-fw20261019"
          crane push _out/installer-amd64.tar "$ref"
          digest=$(crane digest "$ref")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify installer
        run: |
          ref="${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}"
          crane config "$ref" | python3 -c 'import json,sys; c=json.load(sys.stdin); print("entrypoint:", c.get("config",{}).get("Entrypoint"))'
          # firmware fix only: the cwsr workaround must not be in the kernel args
          if grep -qi cwsr _out/imager.log; then echo "unexpected cwsr kernel arg"; exit 1; fi
          # imager log must mention all three extensions
          for e in amd-ucode kelvl/amdgpu qemu-guest-agent; do
            grep -q "$e" _out/imager.log || { echo "missing extension $e in imager log"; exit 1; }
          done
      - name: Summary
        run: |
          {
            echo "### Talos installer published"
            echo ""
            echo '```'
            echo "${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo "Upgrade (reboots the node):"
            echo '```'
            echo "talosctl -n 192.168.1.6 upgrade --image ${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
